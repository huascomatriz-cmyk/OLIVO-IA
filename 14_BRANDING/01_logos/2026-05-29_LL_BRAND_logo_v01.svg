<svg width="320" height="96" viewBox="0 0 320 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BRUZZONE IA">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E5E3A"/>
      <stop offset="1" stop-color="#234A2D"/>
    </linearGradient>
  </defs>
  <!-- Marca: territorio circular + hoja de olivo + punto georreferenciado -->
  <g transform="translate(8,8)">
    <circle cx="40" cy="40" r="38" fill="url(#g)"/>
    <!-- curvas de nivel / territorio -->
    <path d="M14 50 Q40 34 66 50" fill="none" stroke="#EBC987" stroke-width="2.4" opacity="0.9"/>
    <path d="M18 60 Q40 46 62 60" fill="none" stroke="#EBC987" stroke-width="1.8" opacity="0.55"/>
    <!-- hoja de olivo -->
    <path d="M40 16 C30 26 30 40 40 50 C50 40 50 26 40 16 Z" fill="#9CC962"/>
    <path d="M40 18 L40 49" stroke="#2E5E3A" stroke-width="1.6"/>
    <!-- oliva / punto georreferenciado -->
    <circle cx="40" cy="40" r="5.5" fill="#EBC987" stroke="#fff" stroke-width="1.5"/>
  </g>
  <!-- Wordmark -->
  <text x="98" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#2E5E3A" letter-spacing="1">BRUZZONE</text>
  <text x="250" y="46" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#B7873B">IA</text>
  <text x="99" y="66" font-family="Arial, sans-serif" font-size="11.5" fill="#6b756e" letter-spacing="3">TERRITORIO · IA · PRECISIÓN</text>
</svg>
