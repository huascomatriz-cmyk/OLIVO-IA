<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BRUZZONE IA — Registro de operador</title>
<link rel="icon" href="favicon.ico" sizes="any"/>
<link rel="icon" type="image/svg+xml" href="isotipo.svg"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<meta name="theme-color" content="#2E5E3A"/>
<link rel="stylesheet" href="bruzzone-ds.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--green:#2E5E3A;--grey:#6b756e;--line:#e6ece6;}
*{box-sizing:border-box;} body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f4f7f4;color:#1f2a22;display:flex;min-height:100vh;align-items:center;justify-content:center;}
.card{background:#fff;max-width:380px;width:92%;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,.08);overflow:hidden;}
header{background:var(--green);color:#fff;padding:18px;text-align:center;} header .b{font-weight:800;font-size:18px;} header .s{font-size:12px;color:#d7e4d7;}
.pad{padding:20px;}
label{display:block;font-size:12px;color:var(--grey);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.3px;}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;font-size:15px;}
.btn{width:100%;background:var(--green);color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:700;margin-top:14px;cursor:pointer;}
.msg{margin-top:12px;font-size:13px;padding:10px;border-radius:8px;} .msg.ok{background:#e8f5e9;color:#2E7D32;} .msg.err{background:#fdecea;color:#C62828;}
.muted{color:var(--grey);font-size:12px;margin-top:10px;text-align:center;} a{color:var(--green);}
</style>
</head>
<body>
<div class="card">
  <header><img class="bz-brand-logo" src="logo-dark.svg" alt="BRUZZONE IA" style="height:30px;margin:2px auto 6px"/><div class="s">Solicitud de acceso — operador / agrónomo</div></header>
  <div class="pad">
    <label>Nombre completo</label><input id="nombre" type="text" placeholder="Nombre Apellido"/>
    <label>Rol</label><select id="rol"><option value="operador">Operador de terreno</option><option value="agronomo">Agrónomo</option></select>
    <label>Correo electrónico</label><input id="email" type="email" placeholder="tu@correo.cl"/>
    <button class="btn" id="reg">Solicitar acceso (enviar código)</button>
    <div id="out"></div>
    <div class="muted">¿Ya tienes acceso? <a href="2026-05-29_LL_AUTH_login_v01.html">Iniciar sesión</a></div>
  </div>
</div>
<script>
// MVP: el registro usa el mismo OTP que el login (shouldCreateUser:true).
// El nombre y rol se guardan como metadata; la asignación final de rol la valida el admin.
const ENV=window.__ENV__||{SUPABASE_URL:"https://TU-PROYECTO.supabase.co",SUPABASE_ANON_KEY:"TU_ANON_KEY"};
let sb=null; try{ sb=supabase.createClient(ENV.SUPABASE_URL,ENV.SUPABASE_ANON_KEY); }catch(_){}
const out=document.getElementById("out");
function msg(t,c){out.innerHTML=`<div class="msg ${c}">${t}</div>`;}
document.getElementById("reg").onclick=async()=>{
  const nombre=document.getElementById("nombre").value.trim();
  const rol=document.getElementById("rol").value;
  const email=document.getElementById("email").value.trim();
  if(!nombre||!email) return msg("Completa nombre y correo.","err");
  if(!sb) return msg("Configura Supabase (variables de entorno).","err");
  try{
    const { error }=await sb.auth.signInWithOtp({ email, options:{ shouldCreateUser:true, data:{ nombre, rol } } });
    if(error) throw error;
    msg("✔ Solicitud enviada. Revisa tu correo e ingresa el código en la pantalla de inicio de sesión.","ok");
  }catch(e){ msg("Error: "+(e.message||e),"err"); }
};
</script>
</body>
</html>
